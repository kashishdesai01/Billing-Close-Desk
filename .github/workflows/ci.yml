name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=moderate
      - run: npm --prefix web run format:check
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go build -trimpath -o bin/desk ./cmd/desk
      - run: go build -trimpath -o bin/erpsim ./cmd/erpsim
      - run: docker compose up --build -d
      - run: python3 scripts/wait.py
      - run: npx --prefix web playwright install --with-deps chromium
      - run: cd web && npx playwright test
      - run: python3 scripts/demo.py --month 2026-09-01
      - if: always()
        run: docker compose logs --no-color > /tmp/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            /tmp/compose.log
            web/test-results/

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=deploy/terraform fmt -check
      - run: terraform -chdir=deploy/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=deploy/terraform validate
